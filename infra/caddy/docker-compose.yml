# Run from the VPS alongside apps/realtime and (from Phase 1 step 5) the
# Judge0 stack. `realtime` here must match the service name Caddy proxies to.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      REALTIME_DOMAIN: ${REALTIME_DOMAIN}
    networks:
      - interviewhub

  realtime:
    build:
      # Repo root, not apps/realtime: the Dockerfile COPYs root-level files
      # (package-lock.json, turbo.json, packages/db, packages/types) that
      # only exist inside a build context rooted at the repo, not the app.
      context: ../..
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/realtime/.env
    networks:
      - interviewhub

  # Triggers apps/web's scheduled jobs (reminders, retention). The web app runs on Vercel, where the
  # Hobby plan's cron fires at most once a day — far too coarse for a
  # "starts in 1 hour" reminder — so this box, which is always on anyway,
  # calls the route every 10 minutes instead. Each call is idempotent; a
  # missed or doubled tick costs nothing.
  #
  # Set APP_URL (the deployed web app's origin) and CRON_SECRET (identical to
  # apps/web's) in the environment docker compose reads, e.g. infra/caddy/.env.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    # $$ is compose's escape for a literal $, left for the container's shell.
    command:
      - |
        while true; do
          curl -fsS --max-time 60 -H "Authorization: Bearer $$CRON_SECRET" "$$APP_URL/api/cron/reminders" || echo "reminders tick failed"
          echo
          curl -fsS --max-time 120 -H "Authorization: Bearer $$CRON_SECRET" "$$APP_URL/api/cron/retention" || echo "retention tick failed"
          echo
          sleep 600
        done

networks:
  interviewhub:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
